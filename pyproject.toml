[project]
name = "first-cut"
version = "0.1.0"
description = "Agentic workflow that turns a client brief into a reviewed WordPress site draft."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.156.2",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp[cli]>=1.30.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.6",
]
openai = [
    "langchain-openai>=1.7.2",
]
huggingface = [
    "langchain-huggingface>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firstcut", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Line length is enforced by `ruff format`; long string literals are left as-is.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live services (WordPress, LLM); skipped by default"]
addopts = "-m 'not integration'"

[project.scripts]
firstcut = "firstcut.cli:app"
