name: first-cut

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Application Passwords require HTTPS unless the environment type is "local".
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html

  # One-shot container: installs WordPress and creates the agent's Application Password.
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_USER: ${WP_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-change-me-local-only}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_data:/var/www/html
      - ./scripts/wp_setup.sh:/wp_setup.sh:ro
    entrypoint: ["sh", "/wp_setup.sh"]
    restart: "no"

  # WordPress MCP server over streamable HTTP: http://localhost:8765/mcp
  mcp:
    build: .
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8765:8765"
    environment:
      WP_URL: http://wordpress  # container-to-container; links still use localhost:8080
      WP_USER: ${WP_USER:-admin}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}

  # First Cut API (webhook, SSE, approval): http://localhost:8000/docs
  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "--factory", "firstcut.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - mcp
    ports:
      - "8000:8000"
    env_file: .env  # LLM provider/keys and WEBHOOK_SECRET
    environment:
      MCP_WORDPRESS_URL: http://mcp:8765/mcp
      OLLAMA_BASE_URL: http://host.docker.internal:11434  # Ollama runs on the host (GPU)
      CHECKPOINT_DB: /app/data/checkpoints.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"  # makes the name resolve on Linux too
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache          # Figma responses: the free plan allows ~20 reads/month
      - ./secrets:/app/secrets:ro     # Google service account key

volumes:
  db_data:
  wp_data:
